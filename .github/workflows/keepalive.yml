# Supabase free-tier projects auto-pause after 7 days without a database request.
# This keeps the project warm. Without it, the app goes offline after a quiet week
# and needs a manual unpause from the dashboard.
name: keepalive

on:
  schedule:
    - cron: '0 6 */3 * *'   # every 3 days
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1")
          echo "HTTP $code"
          # 200 or 401 both prove the project is awake; 5xx or a hang does not.
          if [ "$code" -ge 500 ] || [ "$code" -eq 000 ]; then
            echo "Supabase appears paused or unreachable"; exit 1
          fi
